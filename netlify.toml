# ═══════════════════════════════════════════════════════════════════
#  Netlify
#
#  Версия Next.js здесь намеренно не пиннится: адаптер
#  @netlify/plugin-nextjs подхватывает ту, что стоит в package.json.
#  Сам плагин Netlify ставит сам по этой записи — в devDependencies
#  его держать не нужно и даже вредно: две копии разных версий.
# ═══════════════════════════════════════════════════════════════════

[build]
  # npm ci, а не npm install: ставит ровно то, что в package-lock.json.
  # install поднял бы минорные версии и мог собрать не тот код, что
  # проверен локально.
  #
  # ── Почему --include=dev ──
  # В образе сборки Netlify выставлен NODE_ENV=production, а npm ci при
  # этом ЗНАЧЕНИИ молча пропускает devDependencies. Локально этого не
  # видно никогда: там NODE_ENV не задан, и ставится всё.
  #
  # Tailwind и его PostCSS-плагин лежат в devDependencies — как и
  # положено инструментам сборки. Без них next build падает на первом
  # же импорте globals.css: «Cannot find module @tailwindcss/postcss».
  # Ровно это и случилось на первой сборке.
  #
  # Флаг решает причину, а не симптом. Переносить tailwind в
  # dependencies было бы неправдой: в рантайме его нет, он отрабатывает
  # на сборке и исчезает.
  command = "npm ci --include=dev && npm run build"
  publish = ".next"

[build.environment]
  # package.json требует >=22; на Netlify по умолчанию версия ниже,
  # и сборка падала бы на --experimental-strip-types в скриптах.
  NODE_VERSION = "22"

# ── Почему здесь НЕТ NODE_ENV ──
# Я ставил сюда NODE_ENV="development" как подстраховку к --include=dev
# и ошибся: переменная в этом блоке действует на ВСЮ команду сборки, а
# не только на установку. `next build` читает NODE_ENV и, если он задан,
# уважает его — то есть собирает проект в режиме разработки.
#
# Ломается это не сразу и не очевидно: установка проходит, компиляция
# проходит, 135 страниц начинают генерироваться, и уже на предрендере
# служебной страницы /_global-error падает
# «TypeError: Cannot read properties of null (reading 'useContext')».
# React в dev-режиме оказывается не тем экземпляром, который ждут
# серверные компоненты.
#
# --include=dev в команде решает задачу devDependencies полностью и без
# побочных эффектов: он влияет на одну команду, а не на всё окружение.
# NODE_ENV Netlify выставит в production сам, и next build соберёт
# продакшен-сборку — как и должен.

# ── Image CDN: откуда разрешено брать картинки ──
# Фото-заглушки идут через /.netlify/images на нашем домене, а не
# напрямую с images.unsplash.com: на iPhone чужой домен картинок не
# показывался (подробно — lib/photos.ts). Без этой строки Image CDN
# отказывает любому внешнему адресу — и правильно: иначе через наш
# домен можно было бы гонять чужие картинки.
[images]
  remote_images = ["https://images\\.unsplash\\.com/.*"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Чего здесь БОЛЬШЕ НЕТ и почему ──
# Тут стоял редирект /api/revalidate → /.netlify/functions/revalidate.
# Он был написан на этапе, когда вебхук только планировался, и к моменту
# появления настоящего маршрута стал ловушкой: функции с таким именем
# в проекте нет, а App-Router-маршруты адаптер обслуживает сам. Редирект
# перехватывал POST от Sanity раньше маршрута и отдавал 404 — вебхук
# молча не работал бы, а на сайте это выглядело как «правки в студии не
# доезжают до продакшена». Ровно тот сорт поломки, который ищут днями.
#
# Никаких редиректов на локали здесь тоже нет: «/» → «/ua» делает
# proxy.ts внутри Next, и дублировать это на уровне Netlify нельзя —
# два разных механизма на один адрес дают цикл.
